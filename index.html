<!doctype html>
<html lang="es">
<head>
  <!-- La página está en español y adapta su tamaño a celulares y computadoras. -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#134b35">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <meta name="description" content="EcoPuntos IIEE: recicla, suma puntos y canjea recompensas escolares.">
  <title>EcoPuntos IIEE · Recicla y gana</title>
  <style>
    /* :root guarda colores y otros valores que se repiten en todo el diseño.
       Si quieres cambiar la identidad visual, empieza por estas variables. */
    :root {
      color-scheme: light;
      --green-950: #103d2b;
      --green-900: #134b35;
      --green-700: #24734b;
      --green-600: #338d5c;
      --green-100: #e8f4e8;
      --green-50: #f4f9f1;
      --ink: #1a2a21;
      --muted: #68776d;
      --line: #e0e8df;
      --surface: #fff;
      --canvas: #f5f7f2;
      --shadow: 0 18px 50px rgba(28, 64, 37, .07);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /* Estas reglas generales hacen que los tamaños sean más fáciles de calcular
       y que botones y campos usen la misma letra que el resto de la página. */
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; min-width: 320px; background: var(--canvas); color: var(--ink); }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {
      outline: 3px solid #9ed7ad; outline-offset: 3px;
    }
    [hidden] { display: none !important; }
    .icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

    /* PANTALLA DE ACCESO: dos columnas en laptop, presentación a la izquierda
       y formulario de ingreso a la derecha. */
    .login-screen { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr) minmax(420px, .93fr); }
    .login-story { position: relative; min-height: 620px; overflow: hidden; padding: clamp(30px, 5vw, 78px); background: var(--green-900); color: white; display: flex; flex-direction: column; justify-content: space-between; }
    .login-story::before, .login-story::after { content: ""; position: absolute; pointer-events: none; border: 1px solid rgba(255,255,255,.12); border-radius: 50%; }
    .login-story::before { width: 740px; height: 740px; right: -380px; top: -300px; }
    .login-story::after { width: 560px; height: 560px; left: -310px; bottom: -390px; }
    .brand { display: inline-flex; align-items: center; gap: 11px; color: inherit; font-weight: 800; letter-spacing: -.04em; font-size: 21px; white-space: nowrap; }
    .brand-mark { display: grid; place-items: center; width: 37px; height: 37px; border-radius: 12px; background: #d9f1a9; color: var(--green-900); transform: rotate(-7deg); }
    .brand-mark .icon { width: 22px; height: 22px; transform: rotate(7deg); stroke-width: 2.3; }
    .brand small { display: block; margin-top: -3px; font-size: 10px; letter-spacing: .19em; font-weight: 800; text-transform: uppercase; opacity: .8; }
    .story-main { position: relative; z-index: 1; max-width: 620px; }
    .eyebrow { margin: 0 0 16px; color: #bfe69e; font-size: 12px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
    .story-main h1 { margin: 0; max-width: 650px; font-size: clamp(48px, 5.7vw, 82px); line-height: 1.03; letter-spacing: -.07em; }
    .story-main h1 em { font-style: normal; color: #d3efae; }
    .story-main p { max-width: 430px; margin: 24px 0 0; color: #d5e9db; font-size: clamp(16px, 1.5vw, 19px); line-height: 1.6; }
    .story-art { position: absolute; right: clamp(22px, 6vw, 80px); bottom: 88px; width: clamp(160px, 23vw, 310px); height: clamp(160px, 23vw, 310px); display: grid; place-items: center; border-radius: 50%; border: 1px solid rgba(255,255,255,.22); background: radial-gradient(circle at 42% 35%, #4a9c68 0, #2d7750 55%, #1d5d40 100%); box-shadow: 0 32px 70px rgba(0,0,0,.16), inset 0 0 0 23px rgba(255,255,255,.05); transform: rotate(-8deg); }
    .story-art .icon { width: 46%; height: 46%; color: #ddf4b2; stroke-width: 1.1; }
    .story-art::before, .story-art::after { content: "✦"; position: absolute; color: #e3f9c5; font-size: 28px; }
    .story-art::before { top: -7px; right: 28px; }
    .story-art::after { bottom: 20px; left: -18px; font-size: 17px; }
    .story-footer { position: relative; z-index: 1; color: #c9dfce; font-size: 13px; }
    .login-panel { display: grid; place-items: center; padding: 36px 24px; }
    .login-card { width: min(100%, 460px); padding: 20px 4px; }
    .login-kicker { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 18px; color: var(--green-700); font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .login-kicker .dot { width: 8px; height: 8px; border-radius: 50%; background: #7cbf69; box-shadow: 0 0 0 5px #e7f3df; }
    .login-card h2 { margin: 0 0 11px; font-size: clamp(34px, 4vw, 45px); letter-spacing: -.06em; line-height: 1.08; }
    .intro { margin: 0 0 28px; color: var(--muted); line-height: 1.6; }
    .mode-switch { display: flex; padding: 5px; gap: 4px; border-radius: 14px; background: #eaf0e8; }
    .mode-switch button { flex: 1; border: 0; border-radius: 10px; background: transparent; padding: 12px 14px; color: #627469; font-weight: 750; transition: background .2s, color .2s, box-shadow .2s; }
    .mode-switch button[aria-pressed="true"] { background: white; color: var(--green-900); box-shadow: 0 2px 8px rgba(15,62,36,.08); }
    .field { display: block; margin-bottom: 18px; }
    .field span { display: block; margin-bottom: 8px; color: #35483a; font-size: 13px; font-weight: 750; }
    .input-wrap { position: relative; }
    .input-wrap .icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: #8b9b90; pointer-events: none; }
    .input-wrap input { padding-left: 44px; }
    input, select { width: 100%; height: 51px; padding: 0 15px; border: 1px solid #dbe5da; border-radius: 12px; background: #fff; color: var(--ink); outline: none; transition: border-color .2s, box-shadow .2s; }
    input:focus, select:focus { border-color: #62ab77; box-shadow: 0 0 0 4px #e7f4e9; }
    input::placeholder { color: #9baa9e; }
    .form-error { min-height: 19px; margin: -5px 0 10px; color: #af3b35; font-size: 13px; font-weight: 650; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 45px; padding: 10px 17px; border: 1px solid transparent; border-radius: 12px; font-weight: 800; transition: transform .15s, background .2s, box-shadow .2s; }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary { background: var(--green-900); color: white; box-shadow: 0 9px 22px rgba(19,75,53,.15); }
    .btn-primary:hover { background: #0d3e2b; }
    .btn-primary:disabled { opacity: .55; cursor: not-allowed; transform: none; }
    .btn-outline { background: white; color: var(--green-900); border-color: #cddfcd; }
    .btn-outline:hover { background: #f5faf4; }
    .btn-full { width: 100%; min-height: 53px; }
    .demo-box { margin-top: 27px; padding: 18px; border: 1px dashed #c9dac9; border-radius: 15px; background: #f7faf4; }
    .demo-box p { margin: 0 0 12px; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .demo-box strong { color: var(--ink); }
    .demo-actions { display: flex; gap: 9px; flex-wrap: wrap; }
    .demo-actions button { border: 1px solid #d3e2d2; background: white; padding: 8px 12px; border-radius: 9px; color: var(--green-900); font-size: 12px; font-weight: 750; }
    .demo-actions button:hover { background: var(--green-100); }

    /* PANELES: estilos compartidos por estudiante y administrador.
       La clase .hero es la tarjeta verde principal; .panel es una tarjeta blanca. */
    .app-shell { min-height: 100vh; }
    .app-header { background: white; border-bottom: 1px solid var(--line); }
    .header-inner { max-width: 1280px; margin: auto; padding: 15px 28px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .app-header .brand { color: var(--green-900); font-size: 19px; }
    .app-header .brand-mark { background: var(--green-900); color: #d7f2af; }
    .header-right { display: flex; align-items: center; gap: 15px; }
    .role-badge { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: var(--green-50); color: var(--green-900); font-size: 12px; font-weight: 800; white-space: nowrap; }
    .role-badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #66b777; }
    .logout { display: inline-flex; align-items: center; gap: 7px; padding: 8px 0; border: 0; background: none; color: #607267; font-size: 13px; font-weight: 750; white-space: nowrap; }
    .logout:hover { color: var(--green-900); }
    .logout .icon { width: 17px; height: 17px; }
    .main { max-width: 1280px; margin: 0 auto; padding: 35px 28px 60px; }
    .page-heading { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 23px; }
    .section-overline { margin: 0 0 6px; color: var(--green-700); font-size: 11px; font-weight: 850; letter-spacing: .16em; text-transform: uppercase; }
    h1, h2, h3, p { overflow-wrap: anywhere; }
    .page-heading h1 { margin: 0; font-size: clamp(28px, 3.2vw, 39px); line-height: 1.1; letter-spacing: -.055em; }
    .page-heading .subtext { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
    .date-chip { padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: white; color: #607267; font-size: 12px; font-weight: 750; white-space: nowrap; }
    .hero { position: relative; overflow: hidden; display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; min-height: 210px; padding: 30px 38px; border-radius: 22px; background: linear-gradient(112deg, #134b35 0%, #23784e 82%, #319461 100%); color: white; box-shadow: 0 20px 40px rgba(22,87,52,.13); }
    .hero::before, .hero::after { content: ""; position: absolute; width: 350px; height: 350px; border: 1px solid rgba(255,255,255,.12); border-radius: 50%; right: -100px; top: -170px; pointer-events: none; }
    .hero::after { width: 290px; height: 290px; right: 80px; top: 90px; }
    .hero-content, .hero-balance { position: relative; z-index: 1; }
    .hero-kicker { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 14px; color: #d4f0ad; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .hero-kicker .icon { width: 16px; height: 16px; }
    .hero h2 { margin: 0; font-size: clamp(25px, 3vw, 38px); letter-spacing: -.055em; }
    .hero p { max-width: 440px; margin: 10px 0 0; color: #dbecdf; line-height: 1.5; font-size: 14px; }
    .hero-balance { min-width: 245px; padding: 17px 21px; border: 1px solid rgba(255,255,255,.25); border-radius: 18px; background: rgba(255,255,255,.13); backdrop-filter: blur(5px); }
    .hero-balance span { display: block; color: #d9ecdd; font-size: 12px; font-weight: 700; }
    .hero-balance strong { display: block; margin-top: 1px; font-size: clamp(46px, 5vw, 66px); line-height: 1.05; letter-spacing: -.07em; }
    .hero-balance small { color: #d9ecdd; font-size: 13px; font-weight: 650; }
    .content-grid { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(300px, .85fr); gap: 22px; align-items: start; margin-top: 25px; }
    .panel { min-width: 0; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); }
    .panel-pad { padding: 23px; }
    .panel-heading { display: flex; justify-content: space-between; align-items: start; gap: 14px; margin-bottom: 18px; }
    .panel-heading h2 { margin: 0; font-size: 20px; letter-spacing: -.04em; }
    .panel-heading p { margin: 5px 0 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
    .panel-count { display: inline-flex; align-items: center; justify-content: center; min-width: 28px; height: 28px; padding: 0 8px; border-radius: 9px; background: var(--green-100); color: var(--green-900); font-size: 12px; font-weight: 800; }
    .rewards-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
    .reward-card { display: flex; flex-direction: column; min-width: 0; padding: 17px; border: 1px solid #e3ebe1; border-radius: 15px; background: #fff; transition: border-color .2s, transform .2s, box-shadow .2s; }
    .reward-card:hover { transform: translateY(-2px); border-color: #b8d5b9; box-shadow: 0 10px 22px rgba(29,77,41,.08); }
    .reward-top { display: flex; align-items: start; justify-content: space-between; gap: 10px; }
    .reward-icon { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 13px; background: #eef4dd; font-size: 24px; }
    .reward-card:nth-child(3n+2) .reward-icon { background: #e4f1ea; }
    .reward-card:nth-child(3n) .reward-icon { background: #f8efde; }
    .reward-number { padding: 5px 8px; border-radius: 6px; background: #f2f6ef; color: #709078; font-size: 10px; font-weight: 850; text-transform: uppercase; letter-spacing: .06em; }
    .reward-category { margin: 15px 0 4px; color: var(--green-700); font-size: 10px; font-weight: 850; text-transform: uppercase; letter-spacing: .09em; }
    .reward-card h3 { min-height: 45px; margin: 0 0 6px; font-size: 15px; line-height: 1.42; letter-spacing: -.015em; }
    .reward-equivalent { margin: 0 0 14px; color: var(--muted); font-size: 11px; line-height: 1.4; }
    .reward-bottom { display: flex; align-items: center; justify-content: space-between; gap: 9px; margin-top: auto; padding-top: 12px; border-top: 1px solid #edf0eb; }
    .reward-cost { white-space: nowrap; color: var(--green-900); font-size: 19px; font-weight: 850; letter-spacing: -.05em; }
    .reward-cost small { margin-left: 3px; color: var(--muted); font-size: 10px; font-weight: 750; letter-spacing: 0; }
    .reward-button { min-height: 35px; padding: 7px 11px; border: 1px solid #cce2cf; border-radius: 9px; background: #edf7ed; color: var(--green-900); font-size: 11px; font-weight: 850; white-space: nowrap; }
    .reward-button:hover { background: #d9eedb; }
    .reward-button.low-balance { border-color: #e7ebe4; background: #f4f6f2; color: #7b897d; }
    .side-stack { display: grid; gap: 20px; }
    .history-list { list-style: none; margin: 0; padding: 0; }
    .history-item { display: flex; align-items: start; gap: 11px; padding: 13px 0; border-top: 1px solid #eef1ec; }
    .history-item:first-child { border-top: 0; padding-top: 0; }
    .history-symbol { display: grid; place-items: center; width: 34px; height: 34px; flex: none; border-radius: 10px; background: #e9f6e9; color: var(--green-700); }
    .history-symbol.debit { background: #fbf0e4; color: #b57830; }
    .history-symbol .icon { width: 16px; height: 16px; }
    .history-copy { flex: 1; min-width: 0; }
    .history-copy strong { display: block; font-size: 12px; font-weight: 800; line-height: 1.4; }
    .history-copy small { display: block; margin-top: 3px; color: #8b988d; font-size: 11px; }
    .history-amount { color: var(--green-700); font-size: 13px; font-weight: 850; white-space: nowrap; }
    .history-amount.debit { color: #b57830; }
    .empty { padding: 20px 8px; color: var(--muted); text-align: center; font-size: 13px; line-height: 1.5; }
    .rates { display: grid; gap: 10px; }
    .rate-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 10px; background: #f6f9f4; font-size: 12px; }
    .rate-row span { min-width: 0; }
    .rate-row small { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; line-height: 1.35; }
    .rate-row strong { color: var(--green-900); white-space: nowrap; }
    .rate-note { margin: 12px 0 0; color: var(--muted); font-size: 11px; line-height: 1.55; }

    /* ADMINISTRACIÓN: tarjetas de estadísticas, formulario de asignación y tabla. */
    .admin-hero { min-height: 190px; }
    .admin-hero .hero-balance { min-width: 205px; }
    .stat-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; margin-top: 19px; }
    .stat-card { padding: 17px 19px; border: 1px solid var(--line); border-radius: 14px; background: white; }
    .stat-card .stat-icon { display: grid; place-items: center; width: 31px; height: 31px; border-radius: 9px; background: var(--green-100); color: var(--green-700); }
    .stat-card .stat-icon .icon { width: 17px; height: 17px; }
    .stat-card strong { display: block; margin: 10px 0 3px; color: var(--green-900); font-size: 27px; line-height: 1; letter-spacing: -.05em; }
    .stat-card span:last-child { color: var(--muted); font-size: 12px; }
    .admin-grid { display: grid; grid-template-columns: minmax(0, .95fr) minmax(0, 1.25fr); gap: 22px; align-items: start; margin-top: 25px; }
    .admin-right { display: grid; gap: 20px; min-width: 0; }
    .admin-field { margin: 0 0 17px; }
    .admin-field label { display: block; margin-bottom: 7px; color: #415247; font-size: 12px; font-weight: 800; }
    .admin-field small { display: block; margin-top: 6px; color: var(--muted); font-size: 11px; line-height: 1.4; }
    .mode-switch { margin: 20px 0; }
    .mode-switch button { font-size: 12px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .point-preview { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 16px; margin: 4px 0 18px; border-radius: 11px; background: #f0f7ee; color: var(--green-900); }
    .point-preview span { font-size: 12px; font-weight: 700; }
    .point-preview strong { font-size: 23px; letter-spacing: -.04em; }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { padding: 11px 12px; background: #f7faf5; color: #829085; font-size: 10px; font-weight: 850; letter-spacing: .09em; text-transform: uppercase; white-space: nowrap; }
    th:first-child { border-radius: 8px 0 0 8px; }
    th:last-child { border-radius: 0 8px 8px 0; text-align: right; }
    td { padding: 15px 12px; border-bottom: 1px solid #edf1eb; font-size: 12px; }
    tbody tr:last-child td { border-bottom: none; }
    td:last-child { text-align: right; color: var(--green-900); font-size: 14px; font-weight: 850; }
    .student-cell { display: flex; align-items: center; gap: 10px; white-space: nowrap; font-weight: 750; }
    .avatar { display: grid; place-items: center; width: 34px; height: 34px; flex: none; border-radius: 50%; background: #dff0d9; color: var(--green-900); font-size: 11px; font-weight: 850; }
    .status-chip { display: inline-block; padding: 5px 8px; border-radius: 7px; background: #ebf6e9; color: var(--green-700); font-size: 10px; font-weight: 750; }
    .admin-history .history-list { max-height: 360px; overflow-y: auto; padding-right: 4px; }
    .admin-form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 12px; }
    .admin-form-grid .wide { grid-column: 1 / -1; }
    .admin-actions { display: grid; gap: 20px; }
    .chart-list { display: grid; gap: 17px; }
    .chart-label { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 7px; font-size: 12px; font-weight: 750; }
    .chart-label strong { color: var(--green-900); white-space: nowrap; }
    .chart-track { height: 13px; border-radius: 999px; background: #edf3eb; overflow: hidden; }
    .chart-fill { height: 100%; border-radius: inherit; background: var(--green-700); min-width: 0; }
    .chart-row:nth-child(2) .chart-fill { background: #78ae68; }
    .chart-row:nth-child(3) .chart-fill { background: #c2a15b; }
    .chart-total { margin: 18px 0 0; color: var(--muted); font-size: 12px; }
    .danger-panel { border-color: #efd9d4; }
    .danger-panel .btn { color: #9e4238; border-color: #e6bdb5; }
    .danger-panel .btn:hover { background: #fff2ee; }
    .app-footer { max-width: 1280px; margin: 0 auto; padding: 0 28px 30px; color: #9aa69b; font-size: 11px; text-align: center; }
    .toast { position: fixed; z-index: 20; right: 22px; bottom: 22px; display: flex; align-items: start; gap: 10px; max-width: min(400px, calc(100vw - 32px)); padding: 14px 17px; border: 1px solid #b8dfbd; border-radius: 13px; background: #fff; color: var(--green-900); box-shadow: 0 16px 50px rgba(17,54,31,.19); font-size: 13px; font-weight: 750; line-height: 1.45; animation: pop .2s ease-out; }
    .toast.error { border-color: #edc7c0; color: #9d423b; }
    .toast .icon { width: 18px; height: 18px; }
    @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* Las reglas @media cambian el diseño cuando la pantalla es más angosta.
       Así las tarjetas siguen siendo legibles en tablet y celular. */
    @media (max-width: 1020px) {
      .login-screen { grid-template-columns: minmax(0, .8fr) minmax(380px, 1fr); }
      .story-art { bottom: 88px; right: 22px; opacity: .7; }
      .content-grid { grid-template-columns: minmax(0, 1.4fr) minmax(270px, .9fr); }
      .reward-bottom { align-items: flex-start; flex-direction: column; }
      .reward-button { width: 100%; }
    }
    @media (max-width: 760px) {
      .login-screen { display: block; }
      .login-story { min-height: 275px; padding: 25px 22px; }
      .story-main { margin: 42px 0 8px; }
      .story-main h1 { max-width: 400px; font-size: 42px; }
      .story-main p { display: none; }
      .story-art { width: 155px; height: 155px; right: -30px; bottom: -35px; opacity: .45; }
      .story-footer { display: none; }
      .login-panel { padding: 27px 20px 45px; }
      .login-card { padding: 0; }
      .main { padding: 25px 18px 45px; }
      .header-inner { padding: 13px 18px; }
      .page-heading { align-items: start; }
      .date-chip { display: none; }
      .content-grid, .admin-grid { grid-template-columns: 1fr; }
      .side-stack { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .app-footer { padding: 0 18px 25px; }
    }
    @media (max-width: 520px) {
      .app-header .brand { font-size: 16px; }
      .brand-mark { width: 34px; height: 34px; }
      .header-right { gap: 10px; }
      .role-badge { display: none; }
      .logout { font-size: 12px; }
      .hero { grid-template-columns: 1fr; padding: 25px; gap: 20px; }
      .hero-balance { min-width: 0; width: 100%; }
      .hero-balance strong { font-size: 53px; }
      .rewards-grid { grid-template-columns: 1fr 1fr; gap: 9px; }
      .reward-card { padding: 13px; }
      .reward-icon { width: 40px; height: 40px; font-size: 21px; }
      .reward-card h3 { min-height: 63px; font-size: 13px; }
      .reward-bottom { gap: 7px; }
      .reward-cost { font-size: 18px; }
      .panel-pad { padding: 17px; }
      .side-stack, .stat-grid { grid-template-columns: 1fr; }
      .stat-grid { gap: 9px; }
      .stat-card { display: flex; align-items: center; gap: 13px; padding: 12px 15px; }
      .stat-card strong { margin: 0; font-size: 21px; }
      .stat-card span:last-child { margin-left: auto; text-align: right; }
      .form-row { grid-template-columns: 1fr; gap: 0; }
      .admin-form-grid { grid-template-columns: 1fr; }
      .toast { right: 16px; bottom: 16px; }
    }
    /* Respeta la preferencia de quienes desean menos animaciones. */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <!-- Biblioteca de íconos SVG: se dibujan una vez y se reutilizan por su id. -->
  <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M20 4c-8 0-14 2.3-14 10a6 6 0 0 0 6 6c7.7 0 10-6 8-16Z"/><path d="M4 21c2-6 6-10 12-13"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4M15 8l4 4-4 4M8 12h11"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-gift" viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="12" rx="2"/><path d="M3 13h18M12 9v12M12 9C8 9 6 7 6 5.5A2.5 2.5 0 0 1 8.5 3C11 3 12 6 12 9Zm0 0c4 0 6-2 6-3.5A2.5 2.5 0 0 0 15.5 3C13 3 12 6 12 9Z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 17h.01"/></symbol>
    <symbol id="i-people" viewBox="0 0 24 24"><path d="M16 20v-1.5a4.5 4.5 0 0 0-9 0V20M17 4.5a4 4 0 0 1 0 8M21 20v-1.5a4.5 4.5 0 0 0-3-4.25"/><circle cx="11.5" cy="8.5" r="4"/></symbol>
    <symbol id="i-coins" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 6v12M15 9.2c-1.5-1.4-5.5-1.1-5.5 1.2 0 2.5 5.5 1 5.5 3.7 0 2.3-4 2.5-6 1"/></symbol>
  </svg>
  <!-- JavaScript coloca aquí la pantalla de acceso o el panel del usuario. -->
  <div id="app"></div>
  <!-- Este aviso aparece al asignar puntos, canjear o mostrar un error. -->
  <div id="toast" class="toast" role="alert" aria-live="assertive" hidden></div>

  <script>
    /* Todo el JavaScript está dentro de esta función para que sus variables
       no se mezclen con las de otras páginas o extensiones del navegador. */
    (() => {
      "use strict";

      // Es un prototipo local: estas credenciales sirven para probar los dos roles.
      // En una aplicación real, las contraseñas se comprobarían en un servidor.
      const STORAGE_KEY = "ecopuntos_iiee_demo_v1";
      const SESSION_KEY = "ecopuntos_iiee_session_v1";
      const STUDENT_ID = "julio";
      const STUDENT_NAME = "Estudiante de prueba";
      const demoAdmin = { username: "admin-demo", password: "demo2026" };

      // Cada material tiene una tarifa: rate indica cuántos puntos vale 1 kg.
      // Por ejemplo, 2 kg de cartón (rate = 8) producen 16 EcoPuntos.
      const materials = [
        { id: "papel", name: "Papel blanco / cuadernos", rate: 10, detail: "Hojas, libros y cuadernos sin espiral" },
        { id: "carton", name: "Cartón / cartulina", rate: 8, detail: "Limpio, seco y aplanado" },
        { id: "revistas", name: "Revistas / periódicos", rate: 5, detail: "Impresos a color o de prensa" }
      ];
      // Aquí puedes cambiar los premios. cost es el precio en EcoPuntos.
      const rewards = [
        { id: 1, name: "Lápiz HB, borrador o tajador", category: "Útiles básicos", cost: 20, equivalent: "2 kg de papel", icon: "✏️" },
        { id: 2, name: "Lapicero de color (azul, negro o rojo)", category: "Útiles básicos", cost: 30, equivalent: "3 kg de papel", icon: "🖊️" },
        { id: 3, name: "Sticker o pack temático", category: "Incentivo escolar", cost: 40, equivalent: "4 kg de papel", icon: "⭐" },
        { id: 4, name: "Resaltador o regla de 30 cm", category: "Útiles intermedios", cost: 60, equivalent: "6 kg de papel", icon: "📏" },
        { id: 5, name: "Vale para el quiosco escolar", category: "Privilegio escolar", cost: 100, equivalent: "10 kg de papel", icon: "🎟️" },
        { id: 6, name: "Cuaderno universitario nuevo", category: "Premio principal", cost: 200, equivalent: "20 kg de papel", icon: "📓" }
      ];
      // Buscamos los contenedores HTML que el programa actualizará.
      const app = document.getElementById("app");
      const toast = document.getElementById("toast");
      let toastTimer;
      // Estas variables recuerdan qué opciones están seleccionadas en los formularios.
      let awardMode = "material";
      // state contiene alumnos y movimientos; session indica quién inició sesión.
      let state = loadState();
      let session = loadSession();

      // Datos que se crean solo la primera vez que se abre el prototipo.
      function initialState() {
        return {
          students: [{ id: STUDENT_ID, name: STUDENT_NAME, username: STUDENT_NAME, password: "demo2026", points: 50 }],
          // Un movimiento "credit" suma puntos; uno "debit" los resta.
          transactions: [{ id: makeId(), studentId: STUDENT_ID, type: "credit", source: "initial", amount: 50, description: "Saldo inicial de prueba", date: new Date().toISOString() }]
        };
      }

      // Cada movimiento recibe un identificador para distinguirlo de los demás.
      function makeId() {
        return `${Date.now()}-${Math.random().toString(36).slice(2, 9)}`;
      }

      // localStorage guarda los datos incluso si cerramos o recargamos la página.
      function loadState() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          // Si hay datos guardados y tienen la estructura esperada, los reutilizamos.
          if (saved && Array.isArray(saved.students) && Array.isArray(saved.transactions)) {
            const demoStudent = saved.students.find(s => s.id === STUDENT_ID);
            if (demoStudent) {
              demoStudent.username ||= STUDENT_NAME;
              demoStudent.password ||= "demo2026";
            }
            if (saved.students.every(s => typeof s.id === "string" && typeof s.name === "string" && Number.isFinite(s.points))) return saved;
          }
        } catch (_) { /* Si no hay almacenamiento disponible, la sesión aún funciona. */ }
        // Si es la primera visita, creamos el alumno con 50 puntos.
        const fresh = initialState();
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(fresh)); } catch (_) {}
        return fresh;
      }

      // JSON.stringify convierte el objeto state en texto para guardarlo.
      function saveState() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (_) {}
      }

      // sessionStorage recuerda el rol solo mientras dura esta pestaña.
      function loadSession() {
        try {
          const value = sessionStorage.getItem(SESSION_KEY);
          if (value === "student") return STUDENT_ID;
          return value === "admin" || state.students.some(s => s.id === value) ? value : null;
        } catch (_) { return null; }
      }
      function saveSession(value) {
        session = value;
        try { value ? sessionStorage.setItem(SESSION_KEY, value) : sessionStorage.removeItem(SESSION_KEY); } catch (_) {}
      }

      // Mostramos números y fechas con un formato familiar en Perú.
      function formatPoints(value) {
        return new Intl.NumberFormat("es-PE", { maximumFractionDigits: 2 }).format(value);
      }
      function formatDate(iso) {
        const date = new Date(iso);
        return Number.isNaN(date.getTime()) ? "Fecha no disponible" : new Intl.DateTimeFormat("es-PE", { dateStyle: "medium", timeStyle: "short" }).format(date);
      }
      // Evita que un texto guardado sea interpretado como código HTML.
      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      }

      // Pequeñas funciones de ayuda para reutilizar íconos y buscar datos.
      function icon(name) {
        return `<svg class="icon" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
      }
      function student() {
        return state.students.find(s => s.id === session);
      }
      function studentTransactions(id = session) {
        // filter conserva los movimientos del alumno; sort pone los nuevos primero.
        return state.transactions.filter(t => t.studentId === id).sort((a, b) => new Date(b.date) - new Date(a.date));
      }

      // Muestra una notificación durante unos segundos. isError cambia su color.
      function notify(message, isError = false) {
        clearTimeout(toastTimer);
        toast.innerHTML = `${icon(isError ? "alert" : "check")}<span>${escapeHtml(message)}</span>`;
        toast.classList.toggle("error", isError);
        toast.hidden = false;
        toastTimer = setTimeout(() => { toast.hidden = true; }, 4200);
      }
      function brand() { return `<span class="brand"><span class="brand-mark">${icon("leaf")}</span><span>EcoPuntos<small>IIEE</small></span></span>`; }

      // Esta es la "puerta de entrada": decide qué pantalla dibujar según el rol.
      function render() {
        if (!session) renderLogin();
        else if (session === "admin") renderAdmin();
        else if (student()) renderStudent();
        else { saveSession(null); renderLogin(); }
      }

      // Construye el formulario de acceso. El texto entre acentos graves (`...`)
      // es una plantilla: permite insertar valores con ${...} dentro del HTML.
      function renderLogin() {
        app.innerHTML = `
          <main class="login-screen">
            <section class="login-story" aria-label="EcoPuntos IIEE">
              ${brand()}
              <div class="story-main">
                <div class="eyebrow">Recicla · Suma · Canjea</div>
                <h1>Pequeñas acciones. <em>Grandes cambios.</em></h1>
                <p>Convierte el papel y cartón que reciclas en recompensas para tu vida escolar.</p>
              </div>
              <div class="story-art" aria-hidden="true">${icon("leaf")}</div>
              <div class="story-footer">Una escuela más verde empieza contigo.</div>
            </section>
            <section class="login-panel">
              <div class="login-card">
                <div class="login-kicker"><span class="dot"></span> Tu espacio ecológico</div>
                <h2>¡Qué bueno verte!</h2>
                <p class="intro">Ingresa a tu cuenta para revisar tus puntos o gestionar el reciclaje escolar.</p>
                <form id="login-form" novalidate>
                  <label class="field"><span>Usuario</span><span class="input-wrap">${icon("user")}<input id="username" name="username" type="text" autocomplete="username" placeholder="Escribe tu usuario" required></span></label>
                  <label class="field"><span>Contraseña</span><span class="input-wrap">${icon("lock")}<input id="password" name="password" type="password" autocomplete="current-password" placeholder="Escribe tu contraseña" required></span></label>
                  <p id="login-error" class="form-error" role="alert" aria-live="polite"></p>
                  <button class="btn btn-primary btn-full" type="submit">Iniciar sesión ${icon("arrow")}</button>
                </form>
                <div class="demo-box">
                  <p><strong>Demostración pública</strong><br>Usa solo cuentas de prueba. Los datos se guardan en este navegador y no se comparten con otros dispositivos.</p>
                  <div class="demo-actions">
                    <button type="button" data-demo="student">Usar cuenta de estudiante</button>
                    <button type="button" data-demo="admin">Usar cuenta de administrador</button>
                  </div>
                </div>
              </div>
            </section>
          </main>`;
        // addEventListener conecta cada botón con la acción que debe ejecutar.
        // Los botones de prueba rellenan usuario y contraseña automáticamente.
        app.querySelectorAll("[data-demo]").forEach(button => button.addEventListener("click", () => {
          const account = button.dataset.demo === "admin" ? demoAdmin : state.students.find(s => s.id === STUDENT_ID);
          app.querySelector("#username").value = account?.username || "";
          app.querySelector("#password").value = account?.password || "";
          app.querySelector("#login-error").textContent = "";
          app.querySelector("#login-form button[type=submit]").focus();
        }));
        app.querySelector("#login-form").addEventListener("submit", event => {
          // Evitamos que el formulario recargue la página antes de validar datos.
          event.preventDefault();
          const username = app.querySelector("#username").value.trim();
          const password = app.querySelector("#password").value;
          const account = state.students.find(s => s.username === username && s.password === password);
          const isAdmin = username === demoAdmin.username && password === demoAdmin.password;
          if (!isAdmin && !account) {
            app.querySelector("#login-error").textContent = "Usuario o contraseña incorrectos.";
            return;
          }
          // El usuario determina el panel; no hace falta seleccionar un rol.
          saveSession(isAdmin ? "admin" : account.id);
          render();
          window.scrollTo(0, 0);
        });
      }

      function appHeader(role) {
        return `<header class="app-header"><div class="header-inner">${brand()}<div class="header-right"><span class="role-badge">${role === "admin" ? "Administrador" : "Estudiante"}</span><button class="logout" id="logout" type="button">${icon("logout")} Cerrar sesión</button></div></div></header>`;
      }

      // Cerrar sesión borra el rol de la pestaña, pero conserva puntos e historial.
      function bindLogout() {
        app.querySelector("#logout").addEventListener("click", () => { clearTimeout(toastTimer); toast.hidden = true; saveSession(null); render(); window.scrollTo(0, 0); });
      }

      // Convierte cada movimiento en un elemento visual de la lista.
      // showStudent añade el nombre del alumno en el panel del administrador.
      function historyMarkup(transactions, showStudent = false) {
        if (!transactions.length) return `<div class="empty">Aún no hay movimientos registrados.</div>`;
        return `<ul class="history-list">${transactions.map(t => {
          const isDebit = t.type === "debit";
          const owner = showStudent ? state.students.find(s => s.id === t.studentId) : null;
          return `<li class="history-item"><span class="history-symbol ${isDebit ? "debit" : ""}">${icon(t.source === "reset" ? "coins" : isDebit ? "gift" : "plus")}</span><span class="history-copy"><strong>${escapeHtml(t.description)}</strong><small>${owner ? escapeHtml(owner.name) + " · " : ""}${formatDate(t.date)}</small></span><span class="history-amount ${isDebit ? "debit" : ""}">${isDebit ? "−" : "+"}${formatPoints(t.amount)}</span></li>`;
        }).join("")}</ul>`;
      }

      // Crea la pequeña tabla de tarifas que aparece en ambos paneles.
      function ratesMarkup() {
        return `<div class="rates">${materials.map(m => `<div class="rate-row"><span>${escapeHtml(m.name)}<small>${escapeHtml(m.detail)}</small></span><strong>${m.rate} pts/kg</strong></div>`).join("")}</div><p class="rate-note">La equivalencia de premios usa papel blanco como referencia.</p>`;
      }

      // Dibuja el saldo, las seis tarjetas de premios y el historial del alumno.
      function renderStudent() {
        const s = student();
        // Del nombre completo tomamos los dos primeros nombres para el saludo.
        const shortName = s.name.split(" ").slice(0, 2).join(" ");
        // map crea una tarjeta HTML por cada objeto del arreglo rewards.
        const rewardCards = rewards.map(r => `<article class="reward-card">
          <div class="reward-top"><span class="reward-icon" aria-hidden="true">${r.icon}</span><span class="reward-number">Premio ${r.id}</span></div>
          <p class="reward-category">${escapeHtml(r.category)}</p><h3>${escapeHtml(r.name)}</h3>
          <p class="reward-equivalent">Equivale a ${escapeHtml(r.equivalent)}</p>
          <div class="reward-bottom"><div class="reward-cost">${r.cost}<small>puntos</small></div><button class="reward-button ${s.points < r.cost ? "low-balance" : ""}" type="button" data-redeem="${r.id}" aria-label="Canjear Premio ${r.id}: ${escapeHtml(r.name)} por ${r.cost} EcoPuntos">Canjear</button></div>
        </article>`).join("");
        app.innerHTML = `${appHeader("student")}<main class="main">
          <div class="page-heading"><div><p class="section-overline">Mi espacio</p><h1>Tu impacto empieza aquí</h1><p class="subtext">Sigue reciclando y conviértelo en oportunidades.</p></div><div class="date-chip">${new Intl.DateTimeFormat("es-PE", { dateStyle: "long" }).format(new Date())}</div></div>
          <section class="hero" aria-label="Saldo de EcoPuntos"><div class="hero-content"><div class="hero-kicker">${icon("leaf")} Tu progreso verde</div><h2>¡Bienvenido, ${escapeHtml(shortName)}!</h2><p>Cada entrega suma. Revisa tus EcoPuntos y elige una recompensa.</p></div><div class="hero-balance"><span>Saldo disponible</span><strong id="student-balance">${formatPoints(s.points)}</strong><small>EcoPuntos</small></div></section>
          <div class="content-grid"><section class="panel panel-pad"><div class="panel-heading"><div><h2>Catálogo de recompensas</h2><p>Elige el premio que quieres canjear con tus puntos.</p></div><span class="panel-count">${rewards.length}</span></div><div class="rewards-grid">${rewardCards}</div></section>
          <aside class="side-stack"><section class="panel panel-pad"><div class="panel-heading"><div><h2>Mis movimientos</h2><p>Ingresos por reciclaje y canjes realizados.</p></div></div>${historyMarkup(studentTransactions())}</section><section class="panel panel-pad"><div class="panel-heading"><div><h2>¿Cuánto vale reciclar?</h2><p>EcoPuntos que recibes por cada kilo.</p></div></div>${ratesMarkup()}</section></aside></div>
        </main><footer class="app-footer">EcoPuntos IIEE · Prototipo escolar de reciclaje</footer>`;
        bindLogout();
        // Cada botón "Canjear" lleva el id del premio en data-redeem.
        app.querySelectorAll("[data-redeem]").forEach(button => button.addEventListener("click", () => redeem(Number(button.dataset.redeem))));
      }

      // Canje: comprobamos el saldo, restamos el costo y guardamos el movimiento.
      function redeem(rewardId) {
        const reward = rewards.find(r => r.id === rewardId);
        const s = student();
        if (!reward || !s) return;
        // Si faltan puntos, avisamos sin cambiar el saldo.
        if (s.points < reward.cost) {
          notify(`Te faltan ${formatPoints(reward.cost - s.points)} EcoPuntos para canjear el Premio ${reward.id}.`, true);
          return;
        }
        // Redondear a dos decimales evita resultados como 2.899999999.
        s.points = Math.round((s.points - reward.cost) * 100) / 100;
        // unshift agrega el canje al inicio del historial.
        state.transactions.unshift({ id: makeId(), studentId: s.id, type: "debit", source: "redeem", amount: reward.cost, description: `Canje: Premio ${reward.id} · ${reward.name}`, date: new Date().toISOString() });
        // Guardamos el nuevo saldo y volvemos a dibujar la pantalla.
        saveState();
        renderStudent();
        notify(`¡Canje confirmado! ${reward.name} por ${reward.cost} EcoPuntos.`);
      }

      // Conserva también el acopio registrado antes de añadir metadatos estructurados.
      function recyclingByMaterial() {
        return materials.map(material => {
          const kilograms = state.transactions.reduce((total, t) => {
            if (t.source !== "recycling") return total;
            if (t.materialId === material.id && Number.isFinite(t.kilograms)) return total + t.kilograms;
            if (t.materialId) return total;
            const match = /^Reciclaje: ([\d.,]+) kg de (.+)$/i.exec(t.description || "");
            if (!match || match[2].toLocaleLowerCase("es-PE") !== material.name.toLocaleLowerCase("es-PE")) return total;
            const kg = Number(match[1].replace(",", "."));
            return Number.isFinite(kg) ? total + kg : total;
          }, 0);
          return { ...material, kilograms: Math.round(kilograms * 100) / 100 };
        });
      }

      // Dibuja el panel de administración: estadísticas, formulario y lista de alumnos.
      function renderAdmin() {
        // reduce suma saldos o puntos; filter selecciona movimientos concretos.
        const totalAvailable = state.students.reduce((sum, s) => sum + s.points, 0);
        const totalAwarded = state.transactions.filter(t => t.type === "credit" && t.source !== "initial").reduce((sum, t) => sum + t.amount, 0);
        const redemptions = state.transactions.filter(t => t.source === "redeem").length;
        const recycling = recyclingByMaterial();
        const maxKg = Math.max(1, ...recycling.map(m => m.kilograms));
        const totalKg = recycling.reduce((sum, m) => sum + m.kilograms, 0);
        const chartRows = recycling.map(m => `<div class="chart-row"><div class="chart-label"><span>${escapeHtml(m.name)}</span><strong>${formatPoints(m.kilograms)} kg</strong></div><div class="chart-track" role="img" aria-label="${escapeHtml(m.name)}: ${formatPoints(m.kilograms)} kilogramos"><div class="chart-fill" style="width:${m.kilograms / maxKg * 100}%"></div></div></div>`).join("");
        // Estas opciones y filas se crean a partir de los arreglos de datos.
        const materialOptions = materials.map(m => `<option value="${m.id}">${escapeHtml(m.name)} · ${m.rate} pts/kg</option>`).join("");
        const studentOptions = state.students.map(s => `<option value="${escapeHtml(s.id)}">${escapeHtml(s.name)}</option>`).join("");
        const rows = state.students.map(s => `<tr><td><div class="student-cell"><span class="avatar">${escapeHtml(s.name.split(" ").map(part => part[0]).slice(0, 2).join(""))}</span>${escapeHtml(s.name)}</div></td><td><span class="status-chip">Activo</span></td><td>${formatPoints(s.points)} pts</td></tr>`).join("");
        app.innerHTML = `${appHeader("admin")}<main class="main">
          <div class="page-heading"><div><p class="section-overline">Panel de control</p><h1>Gestión de reciclaje</h1><p class="subtext">Registra entregas y acompaña el progreso de tus estudiantes.</p></div><div class="date-chip">${new Intl.DateTimeFormat("es-PE", { dateStyle: "long" }).format(new Date())}</div></div>
          <section class="hero admin-hero"><div class="hero-content"><div class="hero-kicker">${icon("leaf")} EcoPuntos IIEE</div><h2>Hagamos que cada kilo cuente.</h2><p>Selecciona un alumno y asigna puntos por el material reciclado o registra un ajuste directo.</p></div><div class="hero-balance"><span>EcoPuntos disponibles</span><strong>${formatPoints(totalAvailable)}</strong><small>entre todos los estudiantes</small></div></section>
          <div class="stat-grid"><div class="stat-card"><span class="stat-icon">${icon("people")}</span><strong>${state.students.length}</strong><span>Estudiantes registrados</span></div><div class="stat-card"><span class="stat-icon">${icon("coins")}</span><strong>${formatPoints(totalAwarded)}</strong><span>Puntos asignados</span></div><div class="stat-card"><span class="stat-icon">${icon("gift")}</span><strong>${redemptions}</strong><span>Premios canjeados</span></div></div>
          <div class="admin-grid"><div class="admin-actions"><section class="panel panel-pad"><div class="panel-heading"><div><h2>Asignar EcoPuntos</h2><p>Registra una entrega y actualiza el saldo de inmediato.</p></div></div>
            <form id="award-form" novalidate><div class="admin-field"><label for="student-select">Seleccionar alumno</label><select id="student-select" name="student">${studentOptions}</select></div>
              <div class="mode-switch" aria-label="Tipo de asignación"><button type="button" data-mode="material" aria-pressed="${awardMode === "material"}">Por kilos reciclados</button><button type="button" data-mode="direct" aria-pressed="${awardMode === "direct"}">Puntos directos</button></div>
              <div id="material-fields" ${awardMode === "material" ? "" : "hidden"}><div class="admin-field"><label for="material-select">Material entregado</label><select id="material-select" name="material">${materialOptions}</select><small id="material-detail">${materials[0].detail}</small></div><div class="admin-field"><label for="kilograms">Peso entregado (kg)</label><input id="kilograms" name="kilograms" type="number" inputmode="decimal" min="0.01" max="10000" step="0.01" placeholder="Ej. 2.5"></div></div>
              <div id="direct-fields" ${awardMode === "direct" ? "" : "hidden"}><div class="admin-field"><label for="direct-points">EcoPuntos a otorgar</label><input id="direct-points" name="directPoints" type="number" inputmode="numeric" min="1" max="100000" step="1" placeholder="Ej. 25"><small>Úsalo para ajustes o bonificaciones escolares.</small></div></div>
              <div class="point-preview"><span>EcoPuntos a añadir</span><strong id="point-preview">0 pts</strong></div><p id="award-error" class="form-error" role="alert" aria-live="polite"></p><button class="btn btn-primary btn-full" type="submit">${icon("plus")} Añadir EcoPuntos</button>
            </form></section>
            <section class="panel panel-pad"><div class="panel-heading"><div><h2>Crear cuenta de estudiante</h2><p>La nueva cuenta podrá iniciar sesión de inmediato en este navegador.</p></div></div>
              <form id="student-form" novalidate><div class="admin-form-grid"><div class="admin-field wide"><label for="new-name">Nombre completo</label><input id="new-name" type="text" maxlength="120" autocomplete="off" required></div><div class="admin-field"><label for="new-username">Usuario</label><input id="new-username" type="text" maxlength="60" autocomplete="off" required></div><div class="admin-field"><label for="new-password">Contraseña</label><input id="new-password" type="password" minlength="6" maxlength="100" autocomplete="new-password" required></div></div><p id="student-error" class="form-error" role="alert" aria-live="polite"></p><button class="btn btn-primary btn-full" type="submit">${icon("plus")} Crear cuenta</button></form>
            </section></div>
            <div class="admin-right"><section class="panel panel-pad"><div class="panel-heading"><div><h2>Alumnos y saldos</h2><p>Saldo actualizado de estudiantes registrados.</p></div></div><div class="table-scroll"><table><thead><tr><th>Estudiante</th><th>Estado</th><th>EcoPuntos</th></tr></thead><tbody>${rows}</tbody></table></div></section>
              <section class="panel panel-pad"><div class="panel-heading"><div><h2>Acopio por material</h2><p>Kilos registrados en entregas de reciclaje.</p></div></div><div class="chart-list">${chartRows}</div><p class="chart-total">Total recolectado: <strong>${formatPoints(totalKg)} kg</strong></p></section>
              <section class="panel panel-pad admin-history"><div class="panel-heading"><div><h2>Actividad reciente</h2><p>Asignaciones y canjes de la comunidad.</p></div></div>${historyMarkup([...state.transactions].sort((a, b) => new Date(b.date) - new Date(a.date)), true)}</section>
              <section class="panel panel-pad"><div class="panel-heading"><div><h2>Tabla de valorización</h2><p>Tarifas aplicadas a cada entrega.</p></div></div>${ratesMarkup()}</section>
              <section class="panel panel-pad danger-panel"><div class="panel-heading"><div><h2>Nuevo ciclo escolar</h2><p>Pon en cero el saldo de todos los estudiantes. El historial de entregas y canjes quedará disponible.</p></div></div><button class="btn btn-outline" id="reset-points" type="button">Reiniciar puntos</button></section>
            </div></div>
        </main><footer class="app-footer">EcoPuntos IIEE · Prototipo escolar de reciclaje</footer>`;
        bindLogout();
        // Al cambiar de modo, material o cantidad, actualizamos el formulario.
        app.querySelectorAll("[data-mode]").forEach(button => button.addEventListener("click", () => setAwardMode(button.dataset.mode)));
        app.querySelector("#material-select").addEventListener("change", () => {
          const material = materials.find(m => m.id === app.querySelector("#material-select").value);
          app.querySelector("#material-detail").textContent = material ? material.detail : "";
          updatePointPreview();
        });
        app.querySelector("#kilograms").addEventListener("input", updatePointPreview);
        app.querySelector("#direct-points").addEventListener("input", updatePointPreview);
        app.querySelector("#award-form").addEventListener("submit", awardPoints);
        app.querySelector("#student-form").addEventListener("submit", createStudent);
        app.querySelector("#reset-points").addEventListener("click", resetPoints);
      }

      // Muestra los campos de kilos o de puntos directos, según la opción elegida.
      function setAwardMode(mode) {
        awardMode = mode;
        app.querySelectorAll("[data-mode]").forEach(button => button.setAttribute("aria-pressed", String(button.dataset.mode === mode)));
        app.querySelector("#material-fields").hidden = mode !== "material";
        app.querySelector("#direct-fields").hidden = mode !== "direct";
        app.querySelector("#award-error").textContent = "";
        updatePointPreview();
      }

      // Lee el formulario y devuelve cuánto se debe sumar. Si hay un dato inválido,
      // devuelve null para impedir que se guarde una asignación incorrecta.
      function currentAward() {
        if (awardMode === "direct") {
          const raw = app.querySelector("#direct-points").value;
          const amount = Number(raw);
          if (!raw || !Number.isInteger(amount) || amount < 1 || amount > 100000) return null;
          return { amount, source: "direct", description: "Asignación directa de EcoPuntos" };
        }
        // En el modo reciclaje buscamos la tarifa del material seleccionado.
        const raw = app.querySelector("#kilograms").value;
        const kg = Number(raw);
        const material = materials.find(m => m.id === app.querySelector("#material-select").value);
        // Aceptamos pesos positivos con hasta dos cifras decimales.
        if (!raw || !Number.isFinite(kg) || kg < 0.01 || kg > 10000 || !material || Math.abs(Math.round(kg * 100) - kg * 100) > 1e-8) return null;
        // Fórmula: EcoPuntos = kilos × puntos por kilo.
        const amount = Math.round(kg * material.rate * 100) / 100;
        return { amount, source: "recycling", materialId: material.id, kilograms: kg, description: `Reciclaje: ${formatPoints(kg)} kg de ${material.name.toLowerCase()}` };
      }

      // Enseña al administrador los puntos calculados antes de guardarlos.
      function updatePointPreview() {
        const award = currentAward();
        app.querySelector("#point-preview").textContent = `${formatPoints(award ? award.amount : 0)} pts`;
      }

      // Se ejecuta al pulsar "Añadir EcoPuntos".
      function awardPoints(event) {
        event.preventDefault();
        const award = currentAward();
        const id = app.querySelector("#student-select").value;
        const s = state.students.find(item => item.id === id);
        if (!s || !award) {
          app.querySelector("#award-error").textContent = awardMode === "material" ? "Ingresa un peso válido de hasta dos decimales." : "Ingresa una cantidad entera y positiva de EcoPuntos.";
          return;
        }
        // Sumamos el premio al alumno seleccionado y registramos la operación.
        s.points = Math.round((s.points + award.amount) * 100) / 100;
        state.transactions.unshift({ id: makeId(), studentId: id, type: "credit", ...award, date: new Date().toISOString() });
        // Persistimos el cambio y actualizamos la tabla y las estadísticas.
        saveState();
        renderAdmin();
        notify(`Se añadieron ${formatPoints(award.amount)} EcoPuntos a ${s.name}.`);
      }
      function createStudent(event) {
        event.preventDefault();
        const name = app.querySelector("#new-name").value.trim().replace(/\s+/g, " ");
        const username = app.querySelector("#new-username").value.trim();
        const password = app.querySelector("#new-password").value;
        const error = app.querySelector("#student-error");
        if (name.length < 3 || username.length < 3 || password.length < 6) {
          error.textContent = "Completa el nombre y usuario (mínimo 3 caracteres) y una contraseña de 6 o más caracteres.";
          return;
        }
        if (username.toLocaleLowerCase("es-PE") === demoAdmin.username.toLocaleLowerCase("es-PE") || state.students.some(s => (s.username || "").toLocaleLowerCase("es-PE") === username.toLocaleLowerCase("es-PE"))) {
          error.textContent = "Ese usuario ya existe. Elige uno diferente.";
          return;
        }
        state.students.push({ id: `student-${makeId()}`, name, username, password, points: 0 });
        saveState();
        renderAdmin();
        notify(`Cuenta creada para ${name}.`);
      }
      function resetPoints() {
        if (!window.confirm("¿Reiniciar a cero los EcoPuntos de todos los estudiantes? Esta acción no se puede deshacer.")) return;
        const date = new Date().toISOString();
        state.students.forEach(s => {
          if (s.points <= 0) return;
          state.transactions.unshift({ id: makeId(), studentId: s.id, type: "debit", source: "reset", amount: s.points, description: "Reinicio de puntos por nuevo ciclo", date });
          s.points = 0;
        });
        saveState();
        renderAdmin();
        notify("Todos los saldos quedaron en cero.");
      }
      // Si otra pestaña modifica localStorage, esta también actualiza su vista.
      window.addEventListener("storage", event => { if (event.key === STORAGE_KEY) { state = loadState(); if (session) render(); } });
      // Primera carga de la aplicación: mostramos acceso o el panel de la sesión.
      render();
      if ("serviceWorker" in navigator && location.protocol !== "file:") {
        window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
      }
    })();
  </script>
</body>
</html>
